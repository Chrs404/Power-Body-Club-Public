<ion-content class="login-content">
  <div class="login">
    <!-- Pannello del marchio: in alto sul telefono, a sinistra sul computer. -->
    <section class="login-brand" aria-label="A.S.D. Power Body Club">
      <img src="logo.png" alt="A.S.D. Power Body Club" class="brand-logo" />
      <p class="brand-sub">Bodybuilding &amp; Fitness · Caccamo</p>
    </section>

    <section class="login-panel">
      <div class="login-testa">
        <h1 class="login-titolo">Accedi alla tua scheda</h1>
        <p class="login-lead">Allenamenti, pesi e orari della palestra in un posto solo.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
        <ion-list lines="none" class="login-list">
          <ion-item class="field">
            <ion-input
              label="Username"
              labelPlacement="stacked"
              formControlName="username"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
              enterkeyhint="next"
            ></ion-input>
          </ion-item>

          <ion-item class="field">
            <ion-input
              label="Password"
              labelPlacement="stacked"
              type="password"
              formControlName="password"
              autocomplete="current-password"
              enterkeyhint="go"
            ></ion-input>
          </ion-item>
        </ion-list>

        @if (errorMessage()) {
          <div class="alert alert-danger py-2 px-3 mb-0" role="alert">
            {{ errorMessage() }}
          </div>
        }

        <button type="submit" class="pbc-btn block login-btn" [disabled]="loading()">
          @if (loading()) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Accedi
          }
        </button>
      </form>

      <p class="login-hint">
        Non hai le credenziali? Rivolgiti al tuo istruttore.
      </p>
    </section>
  </div>
</ion-content>
